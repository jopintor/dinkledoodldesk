# DinkDesk local stack. Run from the repo root:
#   docker compose -f infra/docker-compose.yml --env-file .env up -d --build
# Frontend too (optional; Arjan normally runs it with `npm run dev` instead):
#   docker compose -f infra/docker-compose.yml --env-file .env --profile frontend up -d --build
#
# Demo host (Jose's PC): infra/scripts/demo-up.ps1 does all of this plus KB ingestion and tunnels.
#
# Host ports: backend 8000, chromadb 8001, postgres 5432, n8n 5678, frontend 3000,
# mock-directory 8090, mailpit 8025 (web inbox) and 1025 (SMTP).

name: dinkdesk

x-env-file: &env-file
  env_file:
    - path: ../.env
      required: false

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dinkdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-dinkdesk}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  chromadb:
    # Keep the Python `chromadb` client on the same 1.5.x line as this server.
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data

  n8n:
    image: n8nio/n8n:2.45.4
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-to-a-long-random-string}
      N8N_SECURE_COOKIE: "false"  # plain http on localhost
      GENERIC_TIMEZONE: Asia/Manila
      TZ: Asia/Manila
      # Base URL n8n shows for its webhook nodes. Inside workflows, call the API
      # at http://backend:8000; the backend calls n8n at http://n8n:5678/webhook.
      WEBHOOK_URL: http://localhost:5678/
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    <<: *env-file
    environment:
      # Container-network hostnames override the localhost values in .env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dinkdesk}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-dinkdesk}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      N8N_WEBHOOK_BASE_URL: http://n8n:5678/webhook
      DIRECTORY_BASE_URL: http://mock-directory:8090
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # demo-up.ps1 sets CORS_ORIGINS in the shell to add the tunnel origins; otherwise .env wins.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      # KB ingestion (`python -m app.rag.ingest`) reads the Markdown from here (Settings.kb_dir).
      - ../knowledge-base:/knowledge-base:ro
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started

  frontend:
    profiles: ["frontend"]
    build:
      context: ../frontend
      args:
        # demo-up.ps1 sets this to the backend's tunnel URL so remote browsers can reach the API.
        NEXT_PUBLIC_API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Mocked StaffID directory used by the reset_password tool (docs/README.md decision #3).
  mock-directory:
    build:
      context: ../mock-directory
    restart: unless-stopped
    environment:
      DIRECTORY_API_KEY: ${DIRECTORY_API_KEY:-dev-directory-key}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health').status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    depends_on:
      mailpit:
        condition: service_healthy

  # Local SMTP sink + web inbox: every demo email and "SMS" code lands here.
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: Asia/Manila
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  pgdata:
  chroma_data:
  n8n_data:
