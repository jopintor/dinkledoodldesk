[project]
name = "dinkdesk-backend"
version = "0.1.0"
description = "DinkDesk AI IT helpdesk API (FastAPI + LangChain + ChromaDB)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
]

[project.optional-dependencies]
# Only needed when LLM_PROVIDER=openai.
openai = ["langchain-openai>=0.2"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]
# Load testing (scripts/load_test.py); only the PC that generates the load needs it.
load = ["locust>=2.29"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as argument defaults, so these calls are intended.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "app.deps.require"]

[tool.pytest.ini_options]
testpaths = ["tests"]
